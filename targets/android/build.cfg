[options]
workdir = {builddir}
platforms = android
tools = java
publish = artifact

[build]
configure =
    {cmake} {root} -DCMAKE_BUILD_TYPE={config} -DSTATIC_BUILD={static} -DBINDING=android -DPython_EXECUTABLE={python} -DANDROID_ABI={arch} -DCMAKE_TOOLCHAIN_FILE={toolchain}
build =
    {cmake} --build . --target clean_objects
    {cmake} --build . --config {config} -j{jobs}

[publish]
artifact =
    {python} {target}/support/publish-if-new.py --group io.github.pytgcalls --artifact ntgcalls --version {version} -- bash {target}/gradlew publishAndReleaseToMavenCentral --no-configuration-cache -p {target}
