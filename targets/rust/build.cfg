[options]
workdir = {target}
platforms = linux-x64
tools = rust
publish = final

[build]
generate =
    {cmake} -DROOT_DIR={root} -P {root}/cmake/codegen/GenerateSchema.cmake
    {cmake} -DROOT_DIR={root} -DBINDING=rust -DNTL_OUTPUT_FILE={root}/ntl-output/schema.ntl -P {root}/cmake/codegen/GenerateBinding.cmake

[publish]
final =
    {cmake} -DROOT_DIR={root} -DBINDING=rust -DNTL_OUTPUT_FILE={root}/ntl-output/schema.ntl -P {root}/cmake/codegen/GenerateBinding.cmake
    {cmake} -E copy {root}/README.md ntgcalls/README.md
    {cmake} -E copy {root}/README.md ntgcalls-sys/README.md
    {cmake} -DVERSION={version} -DFILES=ntgcalls/Cargo.toml;ntgcalls-sys/Cargo.toml -P {root}/cmake/codegen/stamp.cmake
    cargo publish -p ntgcalls-sys --no-verify --allow-dirty --manifest-path {target}/Cargo.toml
    cargo publish -p ntgcalls --no-verify --allow-dirty --manifest-path {target}/Cargo.toml
