[options]
workdir = {builddir}

[build]
configure =
    {cmake} {root} -DCMAKE_BUILD_TYPE={config} -DBINDING=python -DPython_EXECUTABLE={python} -DCMAKE_LIBRARY_OUTPUT_DIRECTORY={out} -DCMAKE_LIBRARY_OUTPUT_DIRECTORY_{config_upper}={out} -DCMAKE_TOOLCHAIN_FILE={toolchain}
build =
    {cmake} --build . --target clean_objects
    {cmake} --build . --config {config} -j{jobs}
