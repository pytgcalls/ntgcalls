VIDEO_DESCRIPTION_DESC            = VIDEO_CONFIG_DESC
MEDIA_DESCRIPTION_DESC            = MEDIA_DESC
ON_UPGRADE_DESC                   = CALLBACK_UPGRADE_DESC
