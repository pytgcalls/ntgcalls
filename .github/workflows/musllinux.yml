name: musllinux wheels (stefano-ntgcalls)

on:
  workflow_dispatch:
    inputs:
      rebuild_image:
        description: 'Rebuild the musl Clang build image (slow, needed on first run)'
        type: boolean
        default: true
  release:
    types: [published]

permissions:
  contents: read
  packages: write

env:
  IMAGE_BASE: ghcr.io/sanji78/stefano-ntgcalls

jobs:
  image:
    if: github.event_name == 'workflow_dispatch' && inputs.rebuild_image
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: x86_64, runner: ubuntu-24.04 }
          - { name: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: docker
          file: docker/Clang.muslinux.${{ matrix.arch.name }}.dockerfile
          push: true
          tags: ${{ env.IMAGE_BASE }}/muslinux-${{ matrix.arch.name }}:latest

  wheels:
    needs: image
    if: always() && (needs.image.result == 'success' || needs.image.result == 'skipped')
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: x86_64, runner: ubuntu-24.04 }
          - { name: arm64,  runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.arch.runner }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build wheels (cp313, cp314) inside musl image
        run: |
          docker run --rm -v "$PWD":/src -w /src -e PYPI_TAGS=1 \
            ghcr.io/sanji78/stefano-ntgcalls/muslinux-${{ matrix.arch.name }}:latest \
            bash -euxo pipefail -c '
              git config --global --add safe.directory "*"
              sh musl/glibc_pthread_abi.sh
              for PY in cp313-cp313 cp314-cp314; do
                PYBIN=/opt/python/$PY/bin/python
                $PYBIN -m pip install -U pip setuptools wheel cmake ninja auditwheel
                export PATH="$(dirname $PYBIN):/opt/clang/bin:$PATH"
                GCC_DIR="$(dirname "$(gcc -print-libgcc-file-name)")"
                echo "GCC_DIR=$GCC_DIR"; ls "$GCC_DIR" | head
                export CFLAGS="--gcc-install-dir=$GCC_DIR"
                export CXXFLAGS="--gcc-install-dir=$GCC_DIR -D_LIBCPP_PROVIDES_DEFAULT_RUNE_TABLE"
                clang -O2 -fPIC -c musl/glibc_shim.c -o /tmp/glibc_shim.o
                clang -O2 -fPIC -c musl/lfs64_shim.c -o /tmp/lfs64_shim.o
                export LDFLAGS="--gcc-install-dir=$GCC_DIR /tmp/glibc_shim.o /tmp/lfs64_shim.o"
                rm -rf build
                $PYBIN -m pip wheel . --no-build-isolation --no-deps -v -w dist_raw
                $PYBIN -m auditwheel repair dist_raw/*-$PY-*.whl -w wheelhouse
                rm -rf build
              done
              ls -l wheelhouse'
          sudo chown -R "$(id -u):$(id -g)" wheelhouse
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.arch.name }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  test:
    needs: wheels
    if: ${{ !cancelled() && needs.wheels.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        arch:
          - { name: x86_64, runner: ubuntu-24.04 }
          - { name: arm64,  runner: ubuntu-24.04-arm }
        py: ['3.13', '3.14']
    runs-on: ${{ matrix.arch.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: wheels-${{ matrix.arch.name }}
          path: wheelhouse
      - name: Install and import on Alpine (like Home Assistant)
        run: |
          docker run --rm -i -v "$PWD/wheelhouse":/w python:${{ matrix.py }}-alpine sh -eux <<'EOF'
          pip install --no-index --find-links /w stefano-ntgcalls
          apk add --no-cache binutils >/dev/null
          SO=$(ls /usr/local/lib/python3.*/site-packages/ntgcalls*.so)
          nm -D --undefined-only "$SO" | awk '$1=="U" {print $2}' | sed 's/@.*//' | sort -u > /tmp/need
          { nm -D /lib/ld-musl-*.so.1 | awk '$2 ~ /[TWDBVRi]/ {print $3}' | sed 's/@.*//'
            for l in $(ldd "$SO" 2>/dev/null | awk '/=>/ {print $3}'); do
              nm -D "$l" 2>/dev/null | awk '$2 ~ /[TWDBVRi]/ {print $3}' | sed 's/@.*//'
            done; } | sort -u > /tmp/have
          echo "===== MISSING SYMBOLS ====="
          comm -23 /tmp/need /tmp/have | grep -v '^Py\|^_Py' || true
          echo "==========================="
          python -c "import ntgcalls; print('ntgcalls OK')"
          EOF

  publish:
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' && github.event_name == 'release' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_TOKEN }}
          skip-existing: true
