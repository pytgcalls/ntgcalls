#
# Central registry of CI platforms. Targets list the platform keys they support
# in their own build.cfg [options] platforms; here lives the infra mapping that
# every language shares (runner labels, container images, naming). Adding a new
# language never touches this file; adding a new platform is the only reason to.
#

[linux-x64]
os = ubuntu-latest
blacksmith = blacksmith-4vcpu-ubuntu-2404
container = ghcr.io/pytgcalls/ntgcalls/manylinux-x86_64:latest
shared_name = linux-x86_64
cibw = manylinux_
node_platform = linux
node_arch = x64

[linux-arm64]
os = ubuntu-24.04-arm
blacksmith = blacksmith-4vcpu-ubuntu-2404-arm
container = ghcr.io/pytgcalls/ntgcalls/manylinux-arm64:latest
shared_name = linux-arm64
cibw = manylinux_
node_platform = linux
node_arch = arm64

[macos-arm64]
os = macos-15
blacksmith = blacksmith-6vcpu-macos-15
container =
shared_name = macos-arm64
cibw = macosx_
node_platform = darwin
node_arch = arm64

[windows-x64]
os = windows-2022
blacksmith = blacksmith-4vcpu-windows-2025
container =
shared_name = windows-x86_64
cibw =
node_platform = win32
node_arch = x64

[android]
os = ubuntu-latest
blacksmith = blacksmith-4vcpu-ubuntu-2404
container =
shared_name = android
cibw =
node_platform =
node_arch =
