[options]
workdir = {builddir}
platforms = linux-x64, linux-arm64, macos-arm64, windows-x64
publish = none
output = shared-output
artifact = ntgcalls.{shared_name}-shared_libs
output2 = static-output
artifact2 = ntgcalls.{shared_name}-static_libs

[build]
shared =
    {cmake} {root} -DCMAKE_BUILD_TYPE={config} -DSTATIC_BUILD=OFF -DBINDING=c -DPython_EXECUTABLE={python} -DCMAKE_TOOLCHAIN_FILE={toolchain}
    {cmake} --build . --target clean_objects
    {cmake} --build . --config {config} -j{jobs}
static =
    {cmake} {root} -DCMAKE_BUILD_TYPE={config} -DSTATIC_BUILD=ON -DBINDING=c -DPython_EXECUTABLE={python} -DCMAKE_TOOLCHAIN_FILE={toolchain}
    {cmake} --build . --target clean_objects
    {cmake} --build . --config {config} -j{jobs}
