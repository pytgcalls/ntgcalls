[package]
name = "ntgcalls-sys"
version = "0.0.0"
edition = "2021"
description = "Raw FFI bindings to the ntgcalls C ABI"
license = "LGPL-3.0-only"
repository = "https://github.com/pytgcalls/ntgcalls"
homepage = "https://pytgcalls.github.io/"
readme = "README.md"
keywords = ["telegram", "webrtc", "voip", "mtproto", "ffi"]
categories = ["external-ffi-bindings", "multimedia"]
links = "ntgcalls"
build = "build.rs"

[dependencies]

[build-dependencies]
ureq = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
