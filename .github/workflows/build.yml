name: Build And Publish
permissions:
  contents: read
on:
  workflow_dispatch:
    inputs:
      targets:
        description: 'Targets to build ("all" or a comma list, e.g. c,node)'
        required: false
        default: all
        type: string
      platforms:
        description: 'Platforms filter ("all" or a comma list, e.g. linux-x64)'
        required: false
        default: all
        type: string
      wheels:
        description: 'Build Python wheels'
        required: false
        default: false
        type: boolean
      use-blacksmith:
        description: 'Use Blacksmith runners (faster builds)'
        required: false
        default: false
        type: boolean
      publish:
        description: 'Publish the built targets'
        required: false
        default: true
        type: boolean
jobs:
  setup:
    name: Generate Build Matrix
    runs-on: ubuntu-latest
    outputs:
      build-matrix: ${{ steps.set.outputs.build-matrix }}
      final-matrix: ${{ steps.set.outputs.final-matrix }}
      has-build: ${{ steps.set.outputs.has-build }}
      has-final: ${{ steps.set.outputs.has-final }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Python Requirements
        run: python -m pip install setuptools

      - name: Set matrix
        id: set
        run: |
          build="$(python setup.py -q matrix --targets='${{ inputs.targets }}' --platforms='${{ inputs.platforms }}')"
          final="$(python setup.py -q matrix --targets='${{ inputs.targets }}' --final)"
          {
            echo "build-matrix=$build"
            echo "final-matrix=$final"
            echo "has-build=$([ "$(echo "$build" | jq '.include | length')" -gt 0 ] && echo true || echo false)"
            echo "has-final=$([ "$(echo "$final" | jq '.include | length')" -gt 0 ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.target }} / ${{ matrix.platform }}) [${{ inputs.use-blacksmith == true && 'Blacksmith' || 'GitHub' }}]
    needs: setup
    if: needs.setup.outputs.has-build == 'true'
    runs-on: ${{ inputs.use-blacksmith == true && matrix.blacksmith || matrix.os }}
    container:
      image: ${{ matrix.container }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix: ${{ fromJson(needs.setup.outputs.build-matrix) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        if: matrix.container == ''
        id: python-setup
        with:
          python-version: "3.10 - 3.14"

      - name: Resolve Python path
        id: python
        run: |
          if [[ -n "${{ steps.python-setup.outputs.python-path }}" ]]; then
            echo "path=${{ steps.python-setup.outputs.python-path }}" >> $GITHUB_OUTPUT
          else
            echo "path=python3" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Set up Node
        if: contains(matrix.tools, 'node')
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org

      - name: Set up Java
        if: contains(matrix.tools, 'java')
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central

      - name: Install Python Requirements
        run: |
          "${{ steps.python.outputs.path }}" -m pip install setuptools
        shell: bash

      - name: Install Media Foundation
        if: startsWith(matrix.shared_name, 'windows')
        run: |
          if ((Get-WindowsFeature Server-Media-Foundation).InstallState -ne 'Installed') {
            Install-WindowsFeature Server-Media-Foundation
          }
        shell: powershell

      - name: Build
        run: |
          "${{ steps.python.outputs.path }}" setup.py build_lib --target=${{ matrix.target }}
        shell: bash

      - name: Upload artifact
        if: matrix.artifact != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ./${{ matrix.output }}/*
          if-no-files-found: error

      - name: Upload secondary artifact
        if: matrix.artifact2 != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact2 }}
          path: ./${{ matrix.output2 }}/*
          if-no-files-found: error

      - name: Resolve version
        id: version
        if: github.event.inputs.publish == 'true' && (matrix.publish == 'artifact' || matrix.publish == 'both')
        run: |
          version="$(sed -n 's/.*ntgcalls VERSION \([A-Za-z0-9.]*\).*/\1/p' CMakeLists.txt | head -1)"
          fancy_version="$(cmake -DPROJECT_VERSION="$version" -DGITHUB_TAGS=ON -P cmake/VersionUtil.cmake 2>&1)"
          echo "version=$fancy_version" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Publish artifact
        if: github.event.inputs.publish == 'true' && (matrix.publish == 'artifact' || matrix.publish == 'both')
        run: >
          "${{ steps.python.outputs.path }}" setup.py publish_lib --target=${{ matrix.target }} --phase=artifact
          --platform=${{ matrix.node_platform }} --arch=${{ matrix.node_arch }}
          --set-version=${{ steps.version.outputs.version }}
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

  publish-final:
    name: Publish Final (${{ matrix.target }})
    needs: [ setup, build ]
    if: github.event.inputs.publish == 'true' && needs.setup.outputs.has-final == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.setup.outputs.final-matrix) }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        id: python
        with:
          python-version: "3.12"

      - name: Set up Node
        if: contains(matrix.tools, 'node')
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org

      - name: Set up Java
        if: contains(matrix.tools, 'java')
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          server-id: central

      - name: Install Python Requirements
        run: |
          "${{ steps.python.outputs.python-path }}" -m pip install setuptools
        shell: bash

      - name: Resolve version
        id: version
        run: |
          version="$(sed -n 's/.*ntgcalls VERSION \([A-Za-z0-9.]*\).*/\1/p' CMakeLists.txt | head -1)"
          fancy_version="$(cmake -DPROJECT_VERSION="$version" -DGITHUB_TAGS=ON -P cmake/VersionUtil.cmake 2>&1)"
          echo "version=$fancy_version" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: >
          ${{ steps.python.outputs.python-path }} setup.py publish_lib --target=${{ matrix.target }} --phase=final
          --set-version=${{ steps.version.outputs.version }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_KEY_PASSWORD }}

  build-wheels:
    name: Build Wheels (${{ matrix.shared_name }}) [${{ inputs.use-blacksmith == true && 'Blacksmith' || 'GitHub' }}]
    if: github.event.inputs.wheels == 'true'
    runs-on: ${{ inputs.use-blacksmith == true && matrix.blacksmith || matrix.os }}
    container:
      image: ${{ matrix.container }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, blacksmith: blacksmith-4vcpu-ubuntu-2404, shared_name: linux-x86_64, cibw: manylinux_, container: ghcr.io/pytgcalls/ntgcalls/manylinux-x86_64:latest }
          - { os: arm64-server, blacksmith: blacksmith-4vcpu-ubuntu-2404-arm, shared_name: linux-arm64, cibw: manylinux_, container: ghcr.io/pytgcalls/ntgcalls/manylinux-arm64:latest }
          - { os: macos-15, blacksmith: blacksmith-6vcpu-macos-15, shared_name: macos-arm64, cibw: macosx_, container: '' }
          - { os: windows-2022, blacksmith: blacksmith-4vcpu-windows-2025, shared_name: windows-x86_64, cibw: '', container: '' }
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        if: matrix.container == ''
        id: python-setup
        with:
          python-version: "3.10 - 3.14"

      - name: Resolve Python path
        id: python
        run: |
          if [[ -n "${{ steps.python-setup.outputs.python-path }}" ]]; then
            echo "path=${{ steps.python-setup.outputs.python-path }}" >> $GITHUB_OUTPUT
          else
            echo "path=python3" >> $GITHUB_OUTPUT
          fi
        shell: bash

      - name: Install Python Requirements
        run: |
          "${{ steps.python.outputs.path }}" -m pip install "git+https://github.com/pytgcalls/cibuildwheel.git" setuptools
        shell: bash

      - name: Install Media Foundation
        if: startsWith(matrix.shared_name, 'windows')
        run: |
          if ((Get-WindowsFeature Server-Media-Foundation).InstallState -ne 'Installed') {
            Install-WindowsFeature Server-Media-Foundation
          }
        shell: powershell

      - name: Build wheels
        run: ${{ steps.python.outputs.path }} -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_PROJECT_REQUIRES_PYTHON: ">=3.10"
          CIBW_BUILD: cp3*-${{ matrix.cibw }}*
          CIBW_TEST_COMMAND: python -m unittest discover -s {package}/tests
          CIBW_CONTAINER_ENGINE: none
          CIBW_ENVIRONMENT: "PYPI_TAGS=1"
          CIBW_SKIP: "cp314t-win*"
          CIBW_ARCHS_WINDOWS: "AMD64"
          MACOSX_DEPLOYMENT_TARGET: 14.0

      - uses: actions/upload-artifact@v7
        with:
          name: ntgcalls-${{ matrix.shared_name }}-wheels
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [ build, build-wheels ]
    if: ${{ always() && github.event.inputs.publish == 'true' && (needs.build.result == 'success' || needs.build-wheels.result == 'success') }}
    permissions:
      id-token: write
      contents: write
    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Get library Version
        id: get-library-version
        run: |
          VERSION=$(grep -oP -m 1 'ntgcalls VERSION \K[A-Za-z0-9.]+' CMakeLists.txt)
          echo "Library Version: $VERSION"
          echo "raw_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Patch version number
        id: patch-version
        run: |
          version="${{ steps.get-library-version.outputs.raw_version }}"
          fancy_version="$(cmake -DPROJECT_VERSION="$version" -DGITHUB_TAGS=ON -P cmake/VersionUtil.cmake 2>&1)"
          is_dev=false
          [[ "$version" == *.*.*.* ]] && is_dev=true
          {
            echo "version=$fancy_version"
            echo "is_dev=$is_dev"
          } >> "$GITHUB_OUTPUT"

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: tmp/

      - name: Prepare source distribution
        if: github.event.inputs.wheels == 'true'
        run: |
          python3 -m pip install --upgrade setuptools
          python3 setup.py sdist
        env:
          PYPI_TAGS: 1

      - name: Zip releases
        run: |
          mkdir releases
          for dir in tmp/*_libs; do
            if [ -d "$dir" ]; then
              echo "$dir"
              folder_name=$(basename "$dir" .zip)
              (cd $dir && zip -r "../../releases/${folder_name}.zip" *)
            fi
          done

      - name: Create Release
        id: create-new-release
        if: hashFiles('releases/*') != ''
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ./releases/*
          tag_name: "v${{ steps.patch-version.outputs.version }}"
          name: "NTgCalls auto build v${{ steps.patch-version.outputs.version }}"
          body: "These are the build files for the commit [${{ github.sha }}](https://github.com/${{ github.repository }}/commit/${{ github.sha }}).\nThese files were built during [this workflow run](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})."
          prerelease: ${{ steps.patch-version.outputs.is_dev }}

      - name: Extract artifacts
        if: github.event.inputs.wheels == 'true'
        run: |
          mkdir -p dist
          find tmp -type f -name "*.whl" | xargs -I {} mv {} dist

      - name: Publish a Python distribution to PyPI.
        if: github.event.inputs.wheels == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist/
