# Prose id aliases: "<generated id> = <existing docsdata id>".
# The generated id comes from the schema field name; when docsdata already
# carries that text under a different key, map it here instead of duplicating
# the text. An id with no entry is used as-is.

[params]
SERVERS_DESC     = RTC_SERVERS_DESC
SAMPLE_RATE_DESC = AUDIO_SAMPLE_DESC
CHANNEL_COUNT_DESC = AUDIO_CHAN_DESC
INPUT_DESC       = ARG_INPUT_MEDIA_DESC
FPS_DESC         = VIDEO_FPS_DESC
ROTATION_DESC    = FRAME_DATA_ROTATION_DESC
ABSOLUTE_CAPTURE_TIMESTAMP_MS_DESC = FRAME_DATA_ABSOLUTE_CAPTURE_TIMESTAMP_MS_DESC
NAME_DESC        = DEVICE_NAME_DESC
METADATA_DESC    = DEVICE_METADATA_DESC
ID_DESC          = RTC_ID_DESC
IPV4_DESC        = RTC_IPV4_DESC
IPV6_DESC        = RTC_IPV6_DESC
PORT_DESC        = RTC_PORT_DESC
USERNAME_DESC    = RTC_USERNAME_DESC
PASSWORD_DESC    = RTC_PASSWORD_DESC
TURN_DESC        = RTC_TURN_DESC
STUN_DESC        = RTC_STUN_DESC
TCP_DESC         = RTC_TCP_DESC
PEER_TAG_DESC    = RTC_PEER_TAG_DESC
SEMANTICS_DESC   = SSRC_GROUP_SEMANTICS_DESC
SSRCS_DESC       = SSRC_GROUP_SSRCS_DESC
CHANNEL_ID_DESC  = BROADCAST_CHANNEL_ID_DESC
QUALITY_DESC     = MEDIA_SEGMENT_QUALITY_DESC
MUTED_DESC       = MEDIA_MUTED_DESC
VIDEOPAUSED_DESC = MEDIA_PAUSED_DESC
VIDEOSTOPPED_DESC = MEDIA_STOPPED_DESC
RANDOM_DESC      = R_DESC
KIND_DESC        = CONNECTION_KIND_DESC
TYPE_DESC        = STREAM_TYPE_DESC
GA_HASH_DESC     = G_A_HASH_DESC
ENABLE_DESC      = ENABLE_OR_DISABLE_GLIB_DESC
REQUEST_DESC     = SEGMENT_PART_REQUEST_DESC
VERSIONS_DESC    = LIBRARY_VERSIONS_DESC
MEDIA_DESC       = ARG_MEDIA_DESC
MODE_DESC        = STREAM_MODE_DESC
MSG_KEY_DESC     = SIGNALING_DATA_DESC
PARAMS_DESC      = TG_PARAMS_DESC
PART_ID_DESC     = BROADCAST_PART_ID_DESC
SEGMENT_ID_DESC  = BROADCAST_SEGMENT_ID_DESC
STATUS_DESC      = MEDIA_SEGMENT_STATUS_DESC
TIMESTAMP_DESC   = BROADCAST_TIMESTAMP_DESC

# Scoped overrides, "<tl-method or type docid>.<field> = <id>". A field name
# like "data" means something different on every method, so a single global
# key would be wrong; these win over the [params] table above.

[scoped]
sendBroadcastPart.data  = FRAME_DATA_DESC
VIDEO_DESCRIPTION.width  = VIDEO_WIDTH_DESC
VIDEO_DESCRIPTION.height = VIDEO_HEIGHT_DESC
FRAME_DATA.width         = FRAME_DATA_WIDTH_DESC
FRAME_DATA.height        = FRAME_DATA_HEIGHT_DESC
SEGMENT_PART_REQUEST.limit = SEGMENT_PART_REQUEST_LIMIT_DESC
CONNECTION_INFO.state    = CONNECTION_STATE_DESC
REMOTE_SOURCE.state      = STREAM_STATUS_DESC
onUpgrade.state          = MEDIA_STATE_DESC
onConnectionChange.state = CONNECTION_INFO_DESC
onRemoteSourceChange.state = REMOTE_SOURCE_DESC
onSubchainRequest.subchain_request = SUBCHAIN_REQUEST_DESC
sendExternalFrame.data  = FRAME_BUFFER_DESC
onSignalingData.data    = SIGNALING_DATA_DESC
FRAME.data              = FRAME_BUFFER_DESC

# Page, type and enum-member keys that docsdata already defines under an older
# name. Same rule as [params]: an unlisted key is used as generated.

[pages]
