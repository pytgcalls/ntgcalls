[options]
workdir = {target}
platforms = linux-x64, linux-arm64, macos-arm64, windows-x64
tools = node
publish = both

[build]
install =
    npm install
compile =
    npm run build -- --directory {root} --out {out} --cmake-path {cmake} --CDBINDING=node --CDSTATIC_BUILD={static} --CDPython_EXECUTABLE={python} --CDCMAKE_TOOLCHAIN_FILE={toolchain}

[publish]
artifact =
    node support/pack-platform.mjs --binary build/Release/ntgcalls.node --platform {platform} --arch {arch} --version {version}
    node support/publish-if-new.mjs --spec @ntgcalls/{platform}-{arch} --version {version} --tag {dist_tag} --dir ./packages/{platform}-{arch}
final =
    {cmake} -DROOT_DIR={root} -DBINDING=node -DNTL_OUTPUT_FILE={root}/ntl-output/schema.ntl -P {root}/cmake/codegen/GenerateBinding.cmake
    {cmake} -E copy {root}/README.md README.md
    {cmake} -E copy {root}/LICENSE LICENSE
    {cmake} -DVERSION={version} -DFILES=package.json -P {root}/cmake/codegen/stamp.cmake
    node support/publish-if-new.mjs --spec ntgcalls --version {version} --tag {dist_tag} --dir .
