# Documentation page map for the ntgcalls reference.
# Each entry is "<tl-method> = <Page Title>"; the section is the enclosing header.
# The doc id used to look up prose in docsdata/config.xml is derived from the
# title: "Connect P2P" -> CONNECT_P2P, then _DESC / _DESC2 / _EXAMPLE_<LANG>.
# A method missing from this file is reported by the generator and not emitted.

[Basic Methods]
createP2pCall           = Create P2P Call
initExchange            = Init Exchange
exchangeKeys            = Exchange Keys
skipExchange            = Skip Exchange
connectP2p              = Connect P2P
createCall              = Create Call
initPresentation        = Init Presentation
initConference          = Init Conference
connect                 = Connect
stop                    = Stop
stopPresentation        = Stop Presentation

[Stream Methods]
setStreamSources        = Set Stream Sources
pause                   = Pause
resume                  = Resume
mute                    = Mute
unmute                  = UnMute
time                    = Time

[Advanced Methods]
addIncomingVideo        = Add Incoming Video
removeIncomingVideo     = Remove Incoming Video
getState                = Get State
getCallType             = Get Call Type
getConnectionMode       = Get Connection Mode
getEmojisFingerprint    = Get Emojis Fingerprint
getMediaDevices         = Get Media Devices
getProtocol             = Get Protocol
enableGlibLoop          = Enable GLib Loop
cpuUsage                = CPU Usage
ping                    = Ping
calls                   = Calls
sendBroadcastTimestamp  = Send Broadcast Timestamp
sendBroadcastPart       = Send Broadcast Part
sendSignalingData       = Send Signaling Data
sendExternalFrame       = Send External Frame
updateAudioSsrcMappings = Update Audio Ssrc Mappings
applyBlocks             = Apply Blocks
finishSubchainRequest   = Finish Subchain Request

[Callbacks]
onUpgrade                   = On Upgrade
onStreamEnd                 = On Stream End
onConnectionChange          = On Connection Change
onFrames                    = On Frames
onSignalingData             = On Signaling Data
onRemoteSourceChange        = On Remote Source Change
onRequestBroadcastPart      = On Request Broadcast Part
onRequestBroadcastTimestamp = On Request Broadcast Timestamp
onRequestParticipants       = On Request Participants
onOutboundBlock             = On Outbound Block
onSubchainRequest           = On Subchain Request
onUpdateEmojis              = On Update Emojis

# Exceptions listed per method, emitted in the RAISES block as <config id="..."/>.
[raises]
createP2pCall          = P2P_CONN_ERROR, NTG_STREAM_EXCEPTIONS
createCall             = CONNECTION_ALREADY_EXISTS_EXCEPTION, NTG_STREAM_EXCEPTIONS
initExchange           = CONNECTION_NOT_FOUND_EXCEPTION, CONNECTION_ALREADY_EXCHANGE_EXCEPTION
exchangeKeys           = P2P_CONN_ERROR, CRYPTO_ERROR, INVALID_PARAMS_EXCEPTION
skipExchange           = CONNECTION_NOT_FOUND_EXCEPTION, CONNECTION_ALREADY_ESTABLISHED_EXCEPTION
connectP2p             = P2P_CONN_ERROR, CRYPTO_ERROR, SIGNALING_ERROR_EXCEPTION, SIGNALING_UNSUPPORTED_EXCEPTION
connect                = CONNECTION_NOT_FOUND_EXCEPTION, TELEGRAM_EXCEPTION, TRANSPORT_EXCEPTION
initPresentation       = CONNECTION_NOT_FOUND_EXCEPTION
stop                   = CONNECTION_NOT_FOUND_EXCEPTION
stopPresentation       = PRESENTATION_NOT_INITIALIZED_EXCEPTION, CONNECTION_NOT_FOUND_EXCEPTION
setStreamSources       = CONNECTION_NOT_FOUND_EXCEPTION, NTG_STREAM_EXCEPTIONS, RTMP_STREAMING_UNSUPPORTED
pause                  = CONNECTION_NOT_FOUND_EXCEPTION
resume                 = CONNECTION_NOT_FOUND_EXCEPTION
mute                   = CONNECTION_NOT_FOUND_EXCEPTION
unmute                 = CONNECTION_NOT_FOUND_EXCEPTION
time                   = CONNECTION_NOT_FOUND_EXCEPTION
addIncomingVideo       = CONNECTION_NOT_FOUND_EXCEPTION
removeIncomingVideo    = CONNECTION_NOT_FOUND_EXCEPTION
getState               = CONNECTION_NOT_FOUND_EXCEPTION
getConnectionMode      = CONNECTION_NOT_FOUND_EXCEPTION
sendBroadcastPart      = CONNECTION_NOT_FOUND_EXCEPTION, BROADCAST_EXCEPTIONS
sendBroadcastTimestamp = CONNECTION_NOT_FOUND_EXCEPTION, BROADCAST_EXCEPTIONS
